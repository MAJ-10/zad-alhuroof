  --off-bg:#EDF2F2; --off-ink:#8A9DA1; --off-bd:1.5px solid #E0E9EA;
  --line-r:linear-gradient(90deg,transparent,#C9D8DA);
  --line-l:linear-gradient(-90deg,transparent,#C9D8DA);
  --tile-bg:#FFFFFF; --tile-bd:1.5px solid #D9E4E5; --tile-ink:#14636E; --tile-sh:0 2px 0 #E2EBEC;
  --btn-bg:linear-gradient(180deg,#218D9B 0%,#1A7E8B 100%); --btn-ink:#FFFFFF; --btn-sh:0 3px 0 var(--teal-sh);
  --tg-bg:#FFFFFF; --tg-bd:1.5px solid #C9D8DA; --tg-sh:0 2px 6px rgba(18,58,66,.08);
  --knob-bg:#FCF3D0; --knob-bd:1px solid #E4D48E; --knob-x:3px;
  --logo-filter:none;
}
[data-theme="dark"]{
  --screen:radial-gradient(90% 46% at 82% -6%,rgba(50,170,184,.22) 0%,transparent 60%),
           radial-gradient(70% 40% at 8% 104%,rgba(50,49,185,.20) 0%,transparent 62%),
           radial-gradient(46% 26% at 50% 34%,rgba(182,201,47,.07) 0%,transparent 70%),
           linear-gradient(180deg,#0A2A33 0%,#06181E 52%,#040F13 100%);
  --veil:rgba(7,26,32,.80);
  --ink:#FFFFFF; --ink-soft:#9FB8BD; --lime-ink:#B6C92F; --ghost:rgba(255,255,255,.028);
  --card-bg:rgba(255,255,255,.055); --card-bd:1.5px solid rgba(255,255,255,.11); --card-sh:none;
  --ans-bg:rgba(182,201,47,.13); --ans-bd:1px solid rgba(182,201,47,.42); --ans-line:rgba(182,201,47,.3); --ans-ink:#FFFFFF; --ans-lbl:#C6D874;
  --off-bg:rgba(255,255,255,.045); --off-ink:#9FB8BD; --off-bd:1.5px solid rgba(255,255,255,.10);
  --line-r:linear-gradient(90deg,transparent,rgba(255,255,255,.14));
  --line-l:linear-gradient(-90deg,transparent,rgba(255,255,255,.14));
  --tile-bg:rgba(255,255,255,.065); --tile-bd:1.5px solid rgba(255,255,255,.11); --tile-ink:#EAF4F5; --tile-sh:none;
  --btn-bg:linear-gradient(180deg,#3FBCCA 0%,#1F93A1 100%); --btn-ink:#04262C;
  --btn-sh:0 3px 0 var(--teal-sh),0 0 22px rgba(50,170,184,.30);
  --tg-bg:rgba(255,255,255,.10); --tg-bd:1.5px solid rgba(255,255,255,.22); --tg-sh:none;
  --knob-bg:#B6C92F; --knob-bd:none; --knob-x:29px;
  --logo-filter:brightness(0) invert(1);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--screen);background-attachment:fixed;
  font-family:var(--ui);letter-spacing:0;color:var(--ink);
  min-height:100dvh;display:flex;flex-direction:column;
  transition:background 300ms ease,color 250ms ease;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;letter-spacing:0}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.wrap{width:min(430px,100%);margin-inline:auto;padding-inline:16px}

@keyframes zrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes zflip{0%{transform:rotateY(88deg) scale(.86)}60%{transform:rotateY(-14deg) scale(1.04)}100%{transform:rotateY(0) scale(1)}}
@keyframes zring{0%{opacity:.7;transform:scale(.7)}100%{opacity:0;transform:scale(1.9)}}
@keyframes zglow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes zswap{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
@keyframes zdrop{0%{opacity:0;transform:translateY(-10px) scaleY(.9)}60%{opacity:1;transform:translateY(2px)}100%{transform:none}}
@keyframes zd1{0%{transform:translate(0,0) rotate(-8deg)}100%{transform:translate(26px,38px) rotate(6deg)}}
@keyframes zd2{0%{transform:translate(0,0) rotate(10deg)}100%{transform:translate(-30px,-24px) rotate(-4deg)}}
@keyframes zd3{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(18px,-34px) rotate(9deg)}}
@keyframes zd4{0%{transform:translate(0,0) rotate(6deg)}100%{transform:translate(-20px,30px) rotate(-7deg)}}

.ghosts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ghosts span{position:absolute;font-weight:700;line-height:1;color:var(--ghost);transition:color 300ms ease}
.ghosts span:nth-child(1){top:5%;right:-42px;font-size:168px;animation:zd1 34s ease-in-out infinite alternate}
.ghosts span:nth-child(2){top:37%;left:-34px;font-size:150px;animation:zd2 41s ease-in-out infinite alternate}
.ghosts span:nth-child(3){bottom:5%;right:44px;font-size:138px;animation:zd3 37s ease-in-out infinite alternate}
.ghosts span:nth-child(4){top:19%;left:12%;font-size:104px;animation:zd4 45s ease-in-out infinite alternate}
.ghosts span:nth-child(5){bottom:24%;left:-22px;font-size:126px;animation:zd2 39s ease-in-out infinite alternate}
.ghosts span:nth-child(6){top:60%;right:6%;font-size:112px;animation:zd1 43s ease-in-out infinite alternate}
.ghosts span:nth-child(7){top:1%;left:24%;font-size:92px;animation:zd3 48s ease-in-out infinite alternate}
.ghosts span:nth-child(8){bottom:44%;right:30%;font-size:88px;animation:zd4 52s ease-in-out infinite alternate}

/* ══ الرأس ══ */
.top{flex:none;position:relative;z-index:2;background:transparent}
.top .wrap{display:flex;align-items:center;justify-content:space-between;
  padding-block:max(10px,env(safe-area-inset-top)) 10px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{height:44px;width:auto;filter:var(--logo-filter);transition:filter 300ms ease}
.word{display:flex;align-items:baseline;gap:6px;font-size:20px;font-weight:700;line-height:1}
.word .a{color:var(--lime-ink)}
.word .b{color:var(--ink)}
.tgl{position:relative;flex:none;width:58px;height:32px;border-radius:999px;cursor:pointer;
  background:var(--tg-bg);border:var(--tg-bd);box-shadow:var(--tg-sh);
  transition:background 250ms ease,border-color 250ms ease,transform 120ms ease}
.tgl:active{transform:scale(.94)}
.tgl .knob{position:absolute;top:2.5px;right:var(--knob-x);display:grid;place-items:center;
  width:24px;height:24px;border-radius:999px;background:var(--knob-bg);border:var(--knob-bd);
  transition:right 260ms cubic-bezier(.3,1.3,.4,1),background 250ms ease}
.tgl .moon{display:none}
[data-theme="dark"] .tgl .moon{display:block}
[data-theme="dark"] .tgl .sun{display:none}

/* ══ المتن ══ */
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:14px}

.coinwrap{display:flex;flex-direction:column;align-items:center;gap:7px;padding-bottom:12px;animation:zrise 340ms ease-out 60ms both}
.coinbox{position:relative;display:grid;place-items:center}
.glow{position:absolute;width:120px;height:120px;border-radius:999px;background:radial-gradient(circle,rgba(50,170,184,.30) 0%,transparent 68%);animation:zglow 3.6s ease-in-out infinite}
.ring{position:absolute;width:96px;height:96px;border-radius:30px;border:2.5px solid var(--lime);animation:zring 620ms ease-out both;pointer-events:none}
.coin{position:relative;display:grid;place-items:center;width:84px;height:84px;border-radius:27px;
  background:linear-gradient(160deg,#3FBCCA 0%,#1A7E8B 58%,#14606C 100%);
  border:2.5px solid rgba(255,255,255,.22);
  box-shadow:0 8px 26px rgba(0,0,0,.30),inset 0 2px 0 rgba(255,255,255,.28);
  color:#fff;font-size:44px;font-weight:700;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.22)}
.coin.flip{animation:zflip 460ms ease-out both}
.lname{font-size:16px;font-weight:600;line-height:1.35}

.qcard{border-radius:20px;padding:18px 16px;min-height:92px;display:flex;align-items:center;justify-content:center;
  background:var(--card-bg);border:var(--card-bd);box-shadow:var(--card-sh);
  animation:zrise 360ms ease-out 110ms both;transition:background 250ms ease,border-color 250ms ease}
.qcard p{font-size:19px;font-weight:600;line-height:1.75;text-align:center;text-wrap:pretty}
.fresh{animation:zswap 300ms cubic-bezier(.2,.7,.3,1) both}

.acard{margin-top:8px;border-radius:14px;padding:9px 14px;
  background:var(--ans-bg);border:var(--ans-bd);
  display:flex;align-items:center;gap:10px;
  animation:zdrop 320ms cubic-bezier(.2,.8,.3,1.05) both}
.acard .lbl{flex:none;font-size:11px;font-weight:600;color:var(--ans-lbl);opacity:.9;
  padding-inline-end:11px;border-inline-end:1px solid var(--ans-line)}
.acard .val{flex:1;font-size:17px;font-weight:700;line-height:1.5;color:var(--ans-ink);
  text-align:center;text-wrap:pretty;padding-inline-end:44px}

.acts{display:flex;gap:7px;padding-top:11px;animation:zrise 360ms ease-out 190ms both}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1;
  min-height:46px;padding:0 6px;border-radius:14px;font-size:13.5px;font-weight:600;line-height:1.35;
  white-space:nowrap;cursor:pointer}
.act:active:not(:disabled){box-shadow:none;transform:translateY(3px)}
.act-ans{background:var(--btn-bg);color:var(--btn-ink);box-shadow:var(--btn-sh)}
.act-swap{background:linear-gradient(180deg,var(--lime-top) 0%,var(--lime) 100%);color:var(--on-lime);box-shadow:0 3px 0 var(--lime-sh)}
.act-swap:disabled{background:var(--off-bg);color:var(--off-ink);border:var(--off-bd);box-shadow:none;cursor:default}

.sep{display:flex;align-items:center;gap:10px;padding:16px 0 10px;animation:zrise 360ms ease-out 220ms both}
.sep i{flex:1;height:1.5px}
.sep .r{background:var(--line-r)}
.sep .l{background:var(--line-l)}
.sep span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink-soft)}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tile{display:grid;place-items:center;height:42px;border-radius:11px;cursor:pointer;
  background:var(--tile-bg);border:var(--tile-bd);color:var(--tile-ink);box-shadow:var(--tile-sh);
  font-size:20px;font-weight:600;line-height:1;
  transition:background 160ms ease,color 160ms ease,transform 120ms ease;animation:zrise 320ms ease-out both}
.tile:active{transform:scale(.92)}
.tile:focus-visible{outline:none;box-shadow:0 0 0 2.5px var(--lime)}
.tile.on{background:linear-gradient(180deg,var(--lime-top) 0%,var(--lime) 100%);
  border:1.5px solid var(--lime);box-shadow:0 2px 0 var(--lime-sh);color:var(--on-lime);font-weight:700}

.rand{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  min-height:48px;border-radius:16px;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,var(--red-top) 0%,var(--red) 100%);
  box-shadow:0 3px 0 var(--red-sh);font-size:14px;font-weight:600;
  animation:zrise 360ms ease-out 260ms both}
.rand:hover{background:linear-gradient(180deg,#D14E4D 0%,#B93B3A 100%)}
.rand:active{box-shadow:none;transform:translateY(3px)}

/* ══ التذييل ══ */
.foot{position:relative;z-index:1;flex:none}
.foot .wrap{padding-block:10px max(12px,env(safe-area-inset-bottom));text-align:center;
  display:flex;flex-direction:column;gap:1px}
.foot span{font-size:11.5px;font-weight:400;line-height:1.7;color:var(--ink-soft);opacity:.6}
.foot .n{font-size:10.5px;opacity:.45}

/* ══════════ الستارة ══════════ */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:var(--screen);will-change:transform;
  transition:transform 720ms cubic-bezier(.62,.02,.3,1),visibility 0s linear 720ms}
.splash.gone{transform:translateY(-101%);visibility:hidden;pointer-events:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:14px;perspective:900px}
.sp-club{height:54px;width:auto;filter:var(--logo-filter);animation:spClub 640ms cubic-bezier(.2,.8,.3,1) both}
@keyframes spClub{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
.sp-zad{font-size:clamp(38px,13vw,58px);font-weight:700;line-height:1;color:var(--lime-ink)}
.sp-row{display:flex;gap:clamp(5px,1.6vw,8px);direction:rtl}
.sp-cell{
  width:clamp(38px,10.5vw,52px);aspect-ratio:1;border-radius:14px;
  display:grid;place-items:center;font-size:clamp(20px,6vw,28px);font-weight:700;
  background:var(--tile-bg);border:var(--tile-bd);color:var(--tile-ink);box-shadow:var(--tile-sh);
}
.sp-tag{font-size:12.5px;font-weight:500;color:var(--ink-soft);opacity:0;animation:spTag 500ms ease-out both}
@keyframes spTag{to{opacity:1}}

/* ١ — بلاطات تتقلب */
@keyframes spFlip{0%{opacity:0;transform:rotateY(92deg) scale(.82)}60%{opacity:1;transform:rotateY(-13deg) scale(1.05)}100%{transform:rotateY(0) scale(1)}}
[data-anim="tiles"] .sp-zad{animation:spZadIn 520ms cubic-bezier(.2,.8,.3,1.1) both}
[data-anim="tiles"] .sp-cell{animation:spFlip 540ms cubic-bezier(.2,.8,.3,1.02) both}
@keyframes spZadIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}

/* ٢ — حروف تتساقط */
@keyframes spFall{0%{opacity:0;transform:translateY(-120px) rotate(-16deg)}
  55%{opacity:1;transform:translateY(10px) rotate(4deg)}
  75%{transform:translateY(-6px) rotate(-2deg)}100%{transform:none}}
[data-anim="fall"] .sp-cell{animation:spFall 660ms cubic-bezier(.25,.9,.35,1.05) both}
[data-anim="fall"] .sp-zad{animation:spZadDrop 540ms cubic-bezier(.25,.9,.35,1.05) both}
@keyframes spZadDrop{0%{opacity:0;transform:translateY(-70px)}60%{opacity:1;transform:translateY(6px)}100%{transform:none}}

/* ٣ — كتابة متصلة */
[data-anim="write"] .sp-write{position:relative;font-size:clamp(40px,13.5vw,64px);font-weight:700;line-height:1.3;padding-bottom:10px}
[data-anim="write"] .sp-write .t{display:block;clip-path:inset(0 0 0 100%);animation:spWipe 1100ms cubic-bezier(.5,0,.2,1) 200ms both}
[data-anim="write"] .sp-write .u{position:absolute;inset-block-end:0;inset-inline:0;height:5px;border-radius:999px;
  background:var(--lime);transform-origin:100% 50%;animation:spLine 1100ms cubic-bezier(.5,0,.2,1) 200ms both}
@keyframes spWipe{to{clip-path:inset(0 0 0 0)}}
@keyframes spLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
[data-anim="write"] .sp-write .t .a{color:var(--lime-ink)}

/* ٤ — تتجمّع من التبعثر */
@keyframes spGather{0%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(.5)}
  100%{opacity:1;transform:none}}
[data-anim="gather"] .sp-cell{animation:spGather 760ms cubic-bezier(.2,.85,.3,1.02) both}
[data-anim="gather"] .sp-zad{animation:spZadIn 560ms cubic-bezier(.2,.8,.3,1.1) 520ms both}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="splash" id="splash"><div class="sp" id="sp"></div></div>

<div class="ghosts" aria-hidden="true"><span>ق</span><span>ع</span><span>ن</span><span>س</span><span>م</span><span>ح</span><span>ل</span><span>ط</span></div>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <img id="logo" alt="شعار نادي جيل">
      <div class="word"><span class="a">زاد</span><span class="b">الحروف</span></div>
    </div>
    <button class="tgl" id="tgl" aria-label="تبديل المظهر">
      <span class="knob">
        <svg class="moon" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" fill="#0A2A33"/></svg>
        <svg class="sun" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="#B08A00"/><path d="M12 2.2v2.6M12 19.2v2.6M2.2 12h2.6M19.2 12h2.6M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M4.9 19.1l1.9-1.9M17.2 6.8l1.9-1.9" stroke="#B08A00" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
    </button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="coinwrap">
      <div class="coinbox" id="coinbox">
        <span class="glow" aria-hidden="true"></span>
        <span class="coin" id="coin"></span>
      </div>
      <span class="lname" id="lname"></span>
    </div>

    <div class="qcard"><p id="qtext" aria-live="polite"></p></div>
    <div class="acard" id="acard" hidden><span class="lbl">الإجابة</span><span class="val" id="atext"></span></div>

    <div class="acts">
      <button class="act act-ans" id="bAns">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12S18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
        <span id="ansLabel">عرض الإجابة</span>
      </button>
      <button class="act act-swap" id="bSwap">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h13l-3-3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16.5H7l3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        تبديل السؤال
      </button>
    </div>

    <div class="sep">
      <i class="r"></i>
      <span>
        <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="#B6C92F" stroke-width="1.8"/><path d="M9 3.5v17M15 3.5v17M3.5 9h17M3.5 15h17" stroke="#B6C92F" stroke-width="1.2" opacity=".6"/></svg>
        اختر حرفاً
      </span>
      <i class="l"></i>
    </div>

    <div class="grid" id="grid"></div>

    <button class="rand" id="rand">
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.5" fill="none" stroke="#fff" stroke-width="1.9"/><circle cx="8.6" cy="8.6" r="1.7" fill="#fff"/><circle cx="15.4" cy="15.4" r="1.7" fill="#fff"/><circle cx="12" cy="12" r="1.7" fill="#B6C92F"/></svg>
      حرف عشوائي
    </button>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>إعداد مشرفي المرحلة الابتدائية في نادي جيل</span>
    <span class="n" id="count"></span>
  </div>
</footer>

<script>
/* ══ الستارة: غيّر هذا السطر وحده ══
   'tiles'  بلاطات تتقلب
   'fall'   حروف تتساقط
   'write'  كتابة متصلة

الماء (وهو عكس البحر)؟","a":"اليابسة"},{"q":"ما هي الكلمة التي تعني في اللغة العربية فقدان الأمل وانقطاع الرجاء؟","a":"اليأس"},{"q":"ما هو اسم الزهرة العطرية البيضاء التي تستخدم في العطور وتشتهر بها مدينة دمشق؟","a":"الياسمين"},{"q":"ماذا يسمى العضو في جسم الإنسان الذي نستخدمه في اللمس والإمساك بالأشياء والكتابة؟","a":"اليد"},{"q":"ما هو اسم العملة الرسمية المستخدمة في دولة اليابان؟","a":"الين"},{"q":"ما هي المعركة الشهيرة التي انتصر فيها المسلمون على الروم في بلاد الشام بقيادة خالد بن الوليد؟","a":"اليرموك"},{"q":"ما هو الحرف الذي يعتبر حرف علة ومد ويعتبر الحرف الأخير من الحروف الهجائية؟","a":"الياء"},{"q":"ما هو الاسم القديم للمدينة المنورة قبل أن يهاجر إليها النبي محمد صلى الله عليه وسلم؟","a":"يثرب"},{"q":"ماذا يسمى الاعتقاد الجازم بالله والإيمان المطلق الذي لا يخالطه شك؟","a":"اليقين"},{"q":"ما هو الاسم العربي لذكر النحل أو قائد خلية النحل؟","a":"اليعسوب"},{"q":"هو ما يقابل العسر؟","a":"يسر"}]}];

const L = ['ا','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي'];
const NAMES = {'ا':'الألف','ب':'الباء','ت':'التاء','ث':'الثاء','ج':'الجيم','ح':'الحاء','خ':'الخاء','د':'الدال','ذ':'الذال','ر':'الراء','ز':'الزاي','س':'السين','ش':'الشين','ص':'الصاد','ض':'الضاد','ط':'الطاء','ظ':'الظاء','ع':'العين','غ':'الغين','ف':'الفاء','ق':'القاف','ك':'الكاف','ل':'اللام','م':'الميم','ن':'النون','ه':'الهاء','و':'الواو','ي':'الياء'};
const SHOW = { 'ا':'أ', 'ه':'هـ' };              // صورة الحرف كما تُعرض
const disp = x => SHOW[x] || x;
const $ = s => document.querySelector(s);

document.getElementById('logo').src = LOGO;

const Q = {};
L.forEach(x => Q[x] = []);
RAW.forEach(g => { if (Q[g.letter]) Q[g.letter] = g.items; });
$('#count').textContent = L.reduce((n, x) => n + Q[x].length, 0) + ' سؤالاً · ' + L.length + ' حرفاً';

const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const st = { l: store.get('zh_letter', 'ا'), i: 0, ans: false, theme: store.get('zh_theme', 'light') };
if (!Q[st.l] || !Q[st.l].length) st.l = 'ا';
st.i = Math.floor(Math.random() * Q[st.l].length);

function setTheme(t){
  st.theme = t;
  document.documentElement.dataset.theme = t;
  $('#tgl').setAttribute('aria-label', t === 'dark' ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الليلي');
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0A2A33' : '#FDFEFE';
  store.set('zh_theme', t);
}

function drawGrid(){
  const g = $('#grid');
  g.innerHTML = '';
  L.forEach((x, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile' + (x === st.l ? ' on' : '');
    b.textContent = disp(x);
    b.dataset.l = x;
    b.setAttribute('aria-label', 'حرف ' + NAMES[x]);
    b.setAttribute('aria-pressed', x === st.l);
    b.style.animationDelay = (200 + i * 14) + 'ms';
    b.onclick = () => pick(x);
    g.appendChild(b);
  });
}

/* الأيقونة تنقلب عند تغيّر الحرف فقط */
function render({ flipCoin = false, fresh = true } = {}){
  const pool = Q[st.l];
  const item = pool[st.i % pool.length];

  const coin = $('#coin');
  if (coin.textContent !== disp(st.l)) coin.textContent = disp(st.l);
  if (flipCoin){ coin.classList.remove('flip'); void coin.offsetWidth; coin.classList.add('flip'); }
  $('#lname').textContent = 'حرف ' + NAMES[st.l];

  const q = $('#qtext');
  q.textContent = item.q;
  if (fresh){ q.classList.remove('fresh'); void q.offsetWidth; q.classList.add('fresh'); }

  const a = $('#acard');
  a.hidden = !st.ans;
  if (st.ans) $('#atext').textContent = item.a;

  $('#ansLabel').textContent = st.ans ? 'إخفاء الإجابة' : 'عرض الإجابة';
  $('#bSwap').disabled = pool.length < 2;

  document.querySelectorAll('.tile').forEach(t => {
    const on = t.dataset.l === st.l;
    t.classList.toggle('on', on);
    t.setAttribute('aria-pressed', on);
  });
}

function nextQ(){
  const pool = Q[st.l];
  if (pool.length < 2) return;
  st.i = (st.i + 1) % pool.length;
  st.ans = false;
  render({ flipCoin: false });
}
/* الضغط على الحرف نفسه يبدّل السؤال، والضغط على غيره ينتقل ويقلب الأيقونة */
function pick(x){
  if (!Q[x] || !Q[x].length) return;
  if (x === st.l) return nextQ();
  st.l = x;
  st.i = Math.floor(Math.random() * Q[x].length);
  st.ans = false;
  store.set('zh_letter', x);
  render({ flipCoin: true });
}
function burst(){
  const r = document.createElement('span');
  r.className = 'ring';
  $('#coinbox').appendChild(r);
  setTimeout(() => r.remove(), 700);
}

$('#bAns').onclick = () => { st.ans = !st.ans; if (st.ans) burst(); render({ fresh: false }); };
$('#bSwap').onclick = nextQ;
$('#rand').onclick = () => {
  const pool = L.filter(x => x !== st.l && Q[x].length);
  pick(pool[Math.floor(Math.random() * pool.length)]);
};
$('#tgl').onclick = () => setTheme(st.theme === 'dark' ? 'light' : 'dark');

/* ══ الستارة ══ */
function runSplash(kind){
  const wrap = $('#splash'), sp = $('#sp');
  wrap.dataset.anim = kind;
  const club = `<img class="sp-club" src="${LOGO}" alt="">`;
  let hold = 1500;

  if (kind === 'write'){
    sp.innerHTML = club +
      '<div class="sp-write"><span class="t"><span class="a">زاد</span> الحروف</span><span class="u"></span></div>' +
      '<span class="sp-tag" style="animation-delay:1250ms">بنك أسئلة على حروف الهجاء</span>';
    hold = 1950;
  } else {
    const letters = [...'الحروف'];
    const cells = letters.map((ch, i) => {
      let extra = '';
      let d = 0;
      if (kind === 'tiles')  d = 430 + i * 95;
      if (kind === 'fall')   d = 460 + i * 95;   // بعد ما تستقر «زاد»
      if (kind === 'gather'){
        d = i * 70;
        const ang = (i / letters.length) * Math.PI * 2 + 0.7;
        extra = `--tx:${Math.round(Math.cos(ang) * 150)}px;--ty:${Math.round(Math.sin(ang) * 130)}px;--rot:${Math.round((i % 2 ? 1 : -1) * (25 + i * 9))}deg;`;
      }
      return `<span class="sp-cell" style="${extra}animation-delay:${d}ms">${ch}</span>`;
    }).join('');
    const zadDelay = 0;
    sp.innerHTML = club +
      `<span class="sp-zad" style="animation-delay:${zadDelay}ms">زاد</span>` +
      `<span class="sp-row">${cells}</span>` +
      `<span class="sp-tag" style="animation-delay:${kind === 'fall' ? 1560 : kind === 'gather' ? 1150 : 1100}ms">بنك أسئلة على حروف الهجاء</span>`;
    hold = kind === 'fall' ? 2350 : kind === 'tiles' ? 1750 : 1650;
  }

  const end = () => wrap.classList.add('gone');
  const timer = setTimeout(end, hold);
  wrap.addEventListener('click', () => { clearTimeout(timer); end(); }, { once: true });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ clearTimeout(timer); end(); }
}

setTheme(st.theme);
drawGrid();
render({ flipCoin: true, fresh: false });
runSplash(SPLASH);
</script>
